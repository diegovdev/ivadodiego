info:
  name: get health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: tests
      code: |-
        test("status is ok", function() {
          expect(res.body.status).to.equal("ok");
        });
