info:
  name: post train
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/train"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 60000
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

  scripts:
    - type: tests
      code: |-
        test("status is accepted", function() {
          expect(res.body.status).to.equal("accepted");
        });
