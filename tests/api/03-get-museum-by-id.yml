info:
  name: get museum by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/museums/1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

  scripts:
    - type: tests
      code: |-
        test("not found detail present", function() {
          expect(res.body).to.have.property("detail");
        });
