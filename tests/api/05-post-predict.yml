info:
  name: post predict
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/predict"
  auth: inherit
  body:
    mode: json
    json: |-
      {"population": 1000000}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

  scripts:
    - type: tests
      code: |-
        test("model not available error", function() {
          expect(res.body).to.have.property("detail");
        });
