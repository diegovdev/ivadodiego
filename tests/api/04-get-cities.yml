info:
  name: get cities
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/cities"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

  scripts:
    - type: tests
      code: |-
        test("response is an array", function() {
          expect(res.body).to.be.an("array");
        });
