name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  live-ingest:
    name: Live ingest
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: apk add --no-cache gcc musl-dev g++ libffi-dev openblas-dev
      - name: Install uv
        run: pip install uv --quiet
      - name: Install deps
        run: uv sync --dev
      - name: Start API in background
        run: |
          DATABASE_URL=sqlite:////tmp/nightly.db \
          MODEL_PATH=/tmp/nightly.pkl \
          uv run uvicorn museums.api:app --host 0.0.0.0 --port 8000 &
          until python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"; do sleep 2; done
      - name: Trigger ingest
        run: |
          python -c "
          import urllib.request, json
          req = urllib.request.Request(
              'http://localhost:8000/ingest',
              method='POST',
              headers={'Content-Type': 'application/json'},
              data=b'{}',
          )
          resp = urllib.request.urlopen(req)
          assert resp.status == 202
          "
      - name: Wait for ingest to complete
        run: |
          import time; time.sleep(30)
        shell: python
      - name: Verify museums populated
        run: |
          python -c "
          import urllib.request, json
          resp = urllib.request.urlopen('http://localhost:8000/museums')
          data = json.loads(resp.read())
          assert len(data) > 0, f'expected museums, got {data}'
          print(f'ingest OK: {len(data)} museums')
          "

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + pip-audit
        run: pip install uv pip-audit --quiet
      - name: Install deps
        run: uv sync
      - name: Audit dependencies
        run: pip-audit --requirement <(uv export --no-dev --format requirements-txt)

  trivy-fresh:
    name: Trivy fresh image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t museums:nightly .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: museums:nightly
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  locust:
    name: Locust stress test
    needs: live-ingest
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: apk add --no-cache gcc musl-dev g++ libffi-dev openblas-dev
      - name: Install uv
        run: pip install uv --quiet
      - name: Install deps + locust
        run: uv sync --dev && pip install locust --quiet
      - name: Start API
        run: |
          DATABASE_URL=sqlite:////tmp/locust.db \
          MODEL_PATH=/tmp/locust.pkl \
          uv run uvicorn museums.api:app --host 0.0.0.0 --port 8000 &
          until python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"; do sleep 2; done
      - name: Run Locust
        run: |
          locust \
            --headless \
            --host http://localhost:8000 \
            --users 20 \
            --spawn-rate 5 \
            --run-time 60s \
            --locustfile tests/locustfile.py \
            --csv /tmp/locust \
            --exit-code-on-error 1
      - name: Enforce thresholds
        run: |
          python tests/check_locust_thresholds.py /tmp/locust_stats.csv
