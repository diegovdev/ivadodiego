services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/museums.db
      MODEL_PATH: /data/models/regression.pkl
      LOG_LEVEL: INFO
    volumes:
      - museums-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  jupyter:
    image: quay.io/jupyter/minimal-notebook:python-3.11
    ports:
      - "8888:8888"
    volumes:
      - museums-data:/home/jovyan/data
      - ./notebooks:/home/jovyan/work
    depends_on:
      api:
        condition: service_healthy

volumes:
  museums-data:
